V.report=()=>{const R=S.result||S.lastResult;if(!R)return`<h2>Mission Reports</h2><p class="mu">Run a simulation to generate a report.</p><button class="b" data-a="nav" data-v="sim">Go to simulation</button>`;const {c}=R,M=c.M,oc={success:'ok',partial:'wa',fail:'er'}[R.out],rec=[];

function telem(){const c=calc(),px=PXT[S.comp.prop],T=c.thrust*c.throttle,ac=T/c.mass,off=comOffsetMeters(c),mg=c.dvA/c.dvN,k=mg>=1.15?'ok':mg>=1?'wa':'er',cl=(l,v,q)=>`<div><small>${l}</small><b class='${q||''}'>${v}</b></div>`;return `<div class='tg'>${cl('Mass',f1(c.mass)+' kg')}${cl('Thrust',(T<1?T.toFixed(2):f1(T))+' N')}${cl('Isp',c.isp+' s')}${cl('Burn time',c.burnTime<3600?(c.burnTime/60).toFixed(1)+' min':(c.burnTime/3600).toFixed(1)+' h')}${cl('Accel',(ac<.01?ac.toExponential(1):ac.toFixed(ac<1?3:2))+' m/s²',ac>=.49?'ok':ac>=9.8e-5?'wa':'er')}${cl('dV avail',Math.round(c.dvA)+' m/s',k)}${cl('dV margin',Math.round((mg-1)*100)+'%',k)}${cl('CoM-CoT',f1(off)+' m',off<.2?'ok':off<.5?'wa':'er')}</div>`}
function seqHTML(){const q=S.seq,ix=k=>q.indexOf(k),bad=[];if(ix('fair')>ix('arr')||ix('fair')>ix('ant')||ix('fair')>ix('ops'))bad.push('Separate the fairing before deploying arrays, antenna or instrument cover.');if(S.comp.prop==='d'&&ix('arr')>ix('burn'))bad.push('For electric propulsion, deploy solar arrays before the orbit burn.');return `<div class='sq'>${q.map((k,i)=>`<div class='part' data-part='${{burn:'prop',arr:'power',ant:'comms'}[k]||'bus'}'><span class='mu'>${i+1}</span> ${SQN[k]}<br><button data-a='sq' data-i='${i}' data-d='-1'>&lt;</button><button data-a='tf' data-k='${k}' title='Preview this stage animation only; it does not change mission calculations'>PREVIEW</button><button data-a='sq' data-i='${i}' data-d='1'>&gt;</button></div>`).join('')}</div>${bad.map(t=>`<div class='warn wa'>${t}</div>`).join('')||`<div class='warn ok'>Sequence nominal.</div>`}`}
