<style>

<footer>Sample game data: parameters are simplified and illustrative, not NASA measurements. Real datasets from data.nasa.gov plug into the DATASETS registry.</footer>
<div id='tip'></div><div id="nova"><div class="in"><div class="av"></div><p id="nt"></p><small id="ns"></small><button class="b alt" data-a="tskip">Skip</button><button class="b" id="nn" data-a="tnext">Continue</button></div></div>
<script>
const $=s=>document.querySelector(s),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),f1=n=>Math.round(n*10)/10,sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const GOAL={imaging:'Surface imaging',atmo:'Atmospheric composition',climate:'Climate monitoring',solar:'Solar corona observation',particles:'Energetic particle environment',magnet:'Magnetic field mapping',ice:'Water-ice detection',maps:'Surface mapping',thermal:'Thermal mapping'};
const MIS=[
{id:'zero',n:'Mission Zero: First Light',t:'Low Earth Orbit',b:170,d:120,df:'Tutorial',o:['LEO','SSO'],g:['imaging'],x:'Capture your first images of Earth from orbit.'},
{id:'earth',n:'Earth Atmosphere Observer',t:'Earth (LEO, SSO or GEO)',b:260,d:365,df:'Beginner',o:['LEO','SSO','GEO'],g:['atmo','imaging','climate'],x:'Design a spacecraft capable of observing Earth’s atmosphere and monitoring environmental changes.'},
{id:'sun',n:'Solar Storm Sentinel',t:'Sun–Earth L1 point',b:330,d:540,df:'Intermediate',o:['L1'],g:['solar','particles','magnet'],x:'Watch the Sun from the L1 vantage point and give early warning of space weather.'},
{id:'moon',n:'Lunar Ice Prospector',t:'Moon (lunar orbit)',b:400,d:365,df:'Advanced',o:['LUNAR'],g:['maps','ice','thermal'],x:'Map the Moon’s surface and search for water-ice deposits.'}];
const INS=[
{id:'img',n:'Multispectral Imager',m:25,p:35,c:30,d:40,s:8,k:['imaging','maps']},
{id:'snd',n:'Atmospheric Sounder',m:30,p:45,c:40,d:15,s:10,k:['atmo','climate']},
{id:'lid',n:'Aerosol Lidar',m:40,p:60,c:45,d:10,s:9,k:['atmo','maps']},
{id:'rad',n:'Thermal Radiometer',m:15,p:20,c:20,d:3,s:6,k:['climate','thermal']},
{id:'cor',n:'Solar Coronagraph',m:35,p:30,c:50,d:25,s:10,k:['solar']},
{id:'par',n:'Particle Detector',m:12,p:10,c:18,d:2,s:7,k:['particles']},
{id:'mag',n:'Magnetometer',m:5,p:4,c:8,d:1,s:6,k:['magnet']},
{id:'neu',n:'Neutron Spectrometer',m:15,p:18,c:28,d:4,s:9,k:['ice']}];
const CMP={
power:{n:'Power system',u:'W gen',o:[{id:'a',n:'Small solar arrays',g:120,m:20,c:8},{id:'b',n:'Medium arrays + Li-ion',g:250,m:35,c:15},{id:'c',n:'Large solar arrays',g:450,m:60,c:26}]},
comms:{n:'Communication',o:[{id:'a',n:'UHF radio',r:8,p:8,m:3,c:4},{id:'b',n:'S-band',r:40,p:15,m:8,c:10},{id:'c',n:'X-band',r:150,p:30,m:14,c:20},{id:'d',n:'Ka-band',r:400,p:50,m:20,c:35}]},
prop:{n:'Propulsion',o:[{id:'a',n:'Cold gas',v:150,m:10,c:4,p:0},{id:'b',n:'Monopropellant',v:500,m:40,c:10,p:0},{id:'c',n:'Bipropellant',v:1700,m:70,c:18,p:0},{id:'d',n:'Ion (electric)',v:3000,m:55,c:40,p:60}]},
therm:{n:'Thermal control',o:[{id:'a',n:'Passive (MLI)',l:1,m:5,c:3,p:0},{id:'b',n:'Heaters + radiators',l:2,m:12,c:8,p:12},{id:'c',n:'Active fluid loop',l:3,m:25,c:18,p:30}]},
store:{n:'Data storage',o:[{id:'a',n:'16 GB',s:16,m:1,c:2,p:2},{id:'b',n:'128 GB',s:128,m:3,c:6,p:4},{id:'c',n:'512 GB',s:512,m:6,c:14,p:8}]}};
const ORB={LEO:{n:'Low Earth Orbit',a:'≈500 km',v:250,k:1,s:.65,c:.3,t:1},SSO:{n:'Sun-synchronous',a:'≈700 km polar',v:400,k:.85,s:.95,c:.35,t:1},GEO:{n:'Geostationary',a:'35,786 km',v:1500,k:.28,s:.9,c:1,t:2},LUNAR:{n:'Lunar orbit',a:'Moon-centred',v:900,k:.3,s:.85,c:.45,t:3},L1:{n:'Sun–Earth L1',a:'≈1.5 million km',v:700,k:.22,s:1,c:.35,t:2}};
const TR={a:{n:'Direct transfer',v:1,days:5,x:'Fast. Needs full delta-v.'},b:{n:'Low-energy transfer',v:.7,days:60,x:'Needs 30% less delta-v but costs ~2 months of operations.'}};
const LV=[{id:'a',n:'Light launcher',cap:300,c:15,r:.9},{id:'b',n:'Medium launcher',cap:800,c:40,r:.95},{id:'c',n:'Heavy launcher',cap:2000,c:90,r:.97}];
const DATASETS=[{id:'env-sample',status:'sample',source:'Game sample parameters (illustrative)',use:'Orbit sunlight fraction, contact time, delta-v and instrument figures are simplified game values, not NASA data.'}];
// To integrate NASA data: add {status:'nasa',source:'<title>',url:'https://data.nasa.gov/dataset/...',use:'<how it shapes the mission>'} and map its fields into ORB / INS / MIS.
const STG=['Launch sequence','Spacecraft separation','Orbit insertion','Instrument activation','Scientific data collection','Data transmission','Mission completion'];
const defComp=()=>({power:'b',comms:'b',prop:'b',therm:'a',store:'b'});
const S={view:'control',mission:null,inst:[],comp:defComp(),lv:'b',orb:'LEO',traj:'a',result:null,tut:null,tc:{},busy:false,last:null};
const NAV=[['control','Mission Control'],['briefing','Mission Briefing'],['designer','Spacecraft Designer'],['resources','Resource Management'],['launch','Launch Configuration'],['sim','Simulation'],['report','Mission Reports']];
const TUT=[['control','Welcome to Mission Control, Director. I’m NOVA, your onboard AI. We’ll design, launch and review a mission together.',()=>1],
['briefing','Your objective: image Earth’s surface from low orbit. Every mission is a set of science goals, and instruments exist to meet them. Read the briefing, then continue.',()=>1],
['designer','Select one scientific instrument. The Multispectral Imager matches our goal. Note its mass, power draw and data output.',()=>S.inst.length>0],
['designer','Now configure the spacecraft: change at least one component. Each choice trades mass, power and cost against performance.',()=>S.tc.comp],
['resources','This is Resource Management. Mass, power, budget, storage and downlink all have limits, and amber or red meters will hurt your result. If the downlink is overloaded, try a faster radio.',()=>1],
['launch','Choose a launch vehicle and an orbit (click one of each). The vehicle must lift your mass to that orbit, and the orbit sets delta-v, sunlight and contact time.',()=>S.tc.lv&&S.tc.orb],
['sim','Run the simulation. Every stage is calculated from your design; nothing is random.',()=>S.result],
['report','Here is your first mission report. It explains what worked and what to improve. Finish the tutorial to choose a full mission.',()=>1]];

function calc(){const M=S.mission,orb=ORB[S.orb],tr=TR[S.traj],lv=LV.find(x=>x.id===S.lv),I=S.inst.map(id=>INS.find(x=>x.id===id)),C={};
for(const k in CMP)C[k]=CMP[k].o.find(x=>x.id===S.comp[k]);const CL=Object.values(C);
const mass=120+sum(I,'m')+sum(CL,'m'),cost=20+sum(I,'c')+sum(CL,'c')+lv.c,bus=40+C.comms.p+C.store.p+C.therm.p+C.prop.p,il=sum(I,'p'),gen=C.power.g*orb.s,prod=sum(I,'d'),cap=lv.cap*orb.k,dvN=orb.v*tr.v,dvA=C.prop.v*300/mass*S.fuel/100,down=C.comms.r*orb.c,reqS=prod*.5/orb.c;
return{M,orb,tr,lv,I,C,mass,cost,bus,il,gen,prod,cap,dvN,dvA,down,reqS}}
function warns(c){const w=[],{M}=c,a=(l,t)=>w.push({l,t});
if(!c.I.length)a('er','No instruments selected: nothing to measure.');
if(c.cost>M.b)a('er',`Budget exceeded by $${f1(c.cost-M.b)}M. Mission cannot be approved.`);
if(c.mass>c.cap)a('er',`Mass ${f1(c.mass)} kg exceeds launcher capacity ${f1(c.cap)} kg for this orbit.`);else if(c.mass>c.cap*.92)a('wa','Launch mass margin is under 8%.');
if(c.dvA<c.dvN)a('er',`Delta-v short: need ${f1(c.dvN)} m/s, have ${f1(c.dvA)} m/s.`);
if(!M.o.includes(S.orb))a('er','This orbit cannot meet the mission target. Science goals will fail.');
if(c.bus+c.il>c.gen)a('wa',`Power shortfall (${f1(c.bus+c.il)} W needed, ${f1(c.gen)} W available). Lower-priority instruments will switch off.`);
if(c.C.therm.l<c.orb.t)a('wa','Thermal control is too weak for this orbit; instruments will run degraded.');
if(c.reqS>c.C.store.s)a('wa','Storage too small to buffer data between contacts.');
if(c.prod>c.down)a('wa',`Comms limit: ${f1(c.down)} of ${f1(c.prod)} GB/day can be downlinked.`);
M.g.forEach(k=>{if(!c.I.some(i=>i.k.includes(k)))a('wa','No instrument covers goal: '+GOAL[k]+'.')});
return w}
function evaluate(){const c=calc(),{M,orb,lv,C}=c,st=[],fit=M.o.includes(S.orb),margin=(c.cap-c.mass)/c.cap;let dead=false;
const push=(l,t)=>{st.push({l:dead?'skip':l,t:dead?'Not reached.':t});if(l==='fail')dead=true};
push(margin<0?'fail':margin<.08?'warn':'ok',`${f1(c.mass)} kg vs ${f1(c.cap)} kg capacity (${lv.n} to ${orb.n}); margin ${Math.round(margin*100)}%.${margin<0?' Too heavy: the vehicle cannot reach this orbit.':''}`);
push('ok',`Clean separation; arrays and antennas deployed. Launcher design reliability: ${Math.round(lv.r*100)}%.`);
const ratio=c.dvA/c.dvN;push(ratio<1?'fail':(ratio<1.15||!fit)?'warn':'ok',`Delta-v needed ${f1(c.dvN)} m/s, available ${f1(c.dvA)} m/s (${S.traj==='b'?'low-energy':'direct'} transfer).${ratio<1?' Spacecraft strands short of its orbit.':''}${!fit?' Orbit does not match the mission target; science will be severely limited.':''}`);

push(!c.I.length||!act.length?'fail':(act.length<ins.length||tf<1)?'warn':'ok',!c.I.length?'No instruments aboard.':`${act.length}/${ins.length} instruments powered (${f1(c.gen)} W generated, ${f1(c.bus)} W bus load).${tf<1?` Thermal rating below orbit needs: instruments at ${Math.round(tf*100)}% quality.`:''}`);

push(prod?(sEff<1?'warn':'ok'):'fail',`Produced ${f1(prod)} GB/day; storage buffers ${Math.round(sEff*100)}% of it between ground contacts.`);
const delivered=Math.min(prod*sEff,c.down),frac=prod?delivered/prod:0;
push(frac>=.7?'ok':frac>=.1?'warn':'fail',`Downlink ${f1(c.down)} GB/day; delivered ${f1(delivered)} GB/day (${Math.round(frac*100)}% of production).`);

const opsF=Math.max(0,(M.d-c.tr.days)/M.d),sr=Math.round(goals.reduce((s,g)=>s+g.v,0)/goals.length*100*(.8+.2*opsF)),out=dead?'fail':sr>=75?'success':sr>=25?'partial':'fail';

s+=P('comms',`<line class='con' x1='200' y1='90' x2='200' y2='62'/>`+(C.comms==='a'?`<line x1='200' y1='90' x2='214' y2='40' stroke='#aab4c4'/>`:C.comms==='b'?`<rect x='180' y='62' width='40' height='6' fill='#e6ebf2'/>`:(r=>`<path d='M${200-r} 62Q200 ${62+r*1.1} ${200+r} 62' fill='#1B263B' stroke='#E2E8F0' stroke-width='1.5'/><line x1='200' y1='${62+r*.5}' x2='200' y2='48' stroke='#8A9BB5'/>`)(C.comms==='c'?24:40))+nd(200,90)+`<text class='lb' x='246' y='56'>COMMS</text>`);
s+=P('bus',`<rect x='150' y='90' width='100' height='120' fill='#131B29' stroke='#8A9BB5'/><rect x='150' y='90' width='100' height='120' fill='url(#til)' opacity='.5'/><path d='M150 112H250M150 172H250M200 90V112M200 172V210' stroke='#3b4d6b'/><rect x='154' y='94' width='92' height='112' fill='none' stroke='#8fa0bd' stroke-width='2.5' stroke-dasharray='0 7' stroke-linecap='round'/><path d='M154 116L246 168M246 116L154 168' stroke='#2b3b57' stroke-dasharray='2 3'/><text class='lb' x='156' y='104'>BUS</text>`);
s+=P('therm',C.therm==='a'?`<rect x='148' y='88' width='104' height='124' fill='none' stroke='#c9a24a' stroke-dasharray='6 2'/>`:`<rect x='138' y='176' width='12' height='30' fill='#e6ebf2' opacity='.85'/><rect x='250' y='176' width='12' height='30' fill='#e6ebf2' opacity='.85'/>`+(C.therm==='c'?`<path d='M144 180V202M256 180V202' stroke='#ff7a2a'/>`:'')+nd(150,190)+nd(250,190));
s+=P('store',`<rect x='156' y='178' width='14' height='${{a:12,b:20,c:28}[C.store]}' fill='#1B263B' stroke='#8A9BB5'/>`);
s+=P('prop',(C.prop==='c'?tk(176,22,'#ffb300')+tk(202,22,'#10b981'):tk(176,48,C.prop==='d'?'#66ccff':'#ffb300'))+`<line class='con' x1='200' y1='206' x2='200' y2='212'/><path d='M${200-tr} 210L${200+tr} 210L${200+bw/2} ${yb}L${200-bw/2} ${yb}Z' fill='url(#noz)' stroke='#8A9BB5'/><path d='M200 210V${yb}' stroke='#ff7a2a' stroke-dasharray='2 2'/><path class='plume' d='M${200-bw/2+2} ${yb}L200 ${yb+pl}L${200+bw/2-2} ${yb}Z' fill='url(#plm)'/>`+nd(200,210)+`<text class='lb' x='${214+bw/2}' y='${yb+4}'>ENGINE</text>`);
S.inst.forEach((id,n)=>{const[x,y]=SL[n];s+=P('i:'+id,`<line class='con' x1='${x}' y1='${y}' x2='200' y2='${y<140?112:172}'/><rect x='${x-7}' y='${y-8}' width='14' height='16' fill='#1B263B' stroke='#00E5FF' stroke-width='.8'/><circle cx='${x}' cy='${y}' r='3' fill='none' stroke='#00E5FF' stroke-width='.6'/>`+nd(x,y+8))});
if(off>.2)s+=`<line x1='${cm.x}' y1='${cm.y}' x2='200' y2='${cm.y}' stroke='${oc}' stroke-dasharray='2 2'/>`;
return s+`<g transform='translate(${cm.x},${cm.y})'><path d='M-12 0H12M0 -12V12' stroke='#FFB300' stroke-width='.8'/><circle r='6' fill='#0B0F17' stroke='#FFB300'/><path d='M0 0H-6A6 6 0 0 1 0 -6ZM0 0H6A6 6 0 0 1 0 6Z' fill='#FFB300'/></g><text class='lb' x='${cm.x+10}' y='${cm.y-8}' style='fill:#FFB300'>CoM</text><path d='M200 ${yb+14}V${yb-10}' stroke='#00E5FF'/><path d='M195 ${yb-6}L200 ${yb-14}L205 ${yb-6}Z' fill='#00E5FF'/><text class='lb' x='168' y='${yb+6}' style='fill:#00E5FF'>CoT</text></svg>`}
function telem(){const c=calc(),px=PXT[S.comp.prop],T=px.t*S.thr/100,tw=T/(c.mass*9.81),off=Math.abs(comPos(c).x-200)*10,mg=c.dvA/c.dvN,k=mg>=1.15?'ok':mg>=1?'wa':'er',cl=(l,v,q)=>`<div><small>${l}</small><b class='${q||''}'>${v}</b></div>`;return `<div class='tg'>${cl('Mass',f1(c.mass)+' kg')}${cl('Thrust',(T<1?T.toFixed(2):f1(T))+' N')}${cl('Isp',px.i+' s')}${cl('TWR',tw<.01?tw.toExponential(1):tw.toFixed(2),tw>=.05?'ok':tw>=1e-5?'wa':'er')}${cl('dV avail',Math.round(c.dvA)+' m/s',k)}${cl('dV margin',Math.round((mg-1)*100)+'%',k)}${cl('CoM-CoT',f1(off)+' mm',off<20?'ok':off<50?'wa':'er')}</div>`}
function seqHTML(){const q=S.seq,ix=k=>q.indexOf(k),bad=[];if(ix('fair')>ix('arr')||ix('fair')>ix('ant'))bad.push('Arrays and antenna cannot deploy inside the fairing.');if(ix('arr')>ix('burn'))bad.push('Deploy arrays before the orbit burn or it runs on battery.');return `<div class='sq'>${q.map((k,i)=>`<div class='part' data-part='${{burn:'prop',arr:'power',ant:'comms'}[k]||'bus'}'><span class='mu'>${i+1}</span> ${SQN[k]}<br><button data-a='sq' data-i='${i}' data-d='-1'>&lt;</button><button data-a='tf' data-k='${k}'>TEST</button><button data-a='sq' data-i='${i}' data-d='1'>&gt;</button></div>`).join('')}</div>${bad.map(t=>`<div class='warn wa'>${t}</div>`).join('')||`<div class='warn ok'>Sequence nominal.</div>`}`}
function refresh(){const a=$('#sch');if(!a)return;a.innerHTML=schem();$('#tel').innerHTML=telem();$('#dsh').innerHTML=dash(calc());$('#seq').innerHTML=seqHTML()}
document.body.addEventListener('input',e=>{const k=e.target.dataset.s;if(!k)return;S[k]=+e.target.value;if(k==='fuel')S.result=null;$('#'+k+'v').textContent=S[k]+'%';refresh()});
document.body.addEventListener('mousemove',e=>{const sp=e.target.closest('.space');if(sp){const r=sp.getBoundingClientRect();sp.style.setProperty('--px',((e.clientX-r.left)/r.width-.5).toFixed(2));sp.style.setProperty('--py',((e.clientY-r.top)/r.height-.5).toFixed(2))}const el=e.target.closest('[data-part]'),k=el?el.dataset.part:null,tp=$('#tip');if(k!==HK){document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));HK=k;if(k){document.querySelectorAll('[data-part="'+k+'"]').forEach(x=>x.classList.add('hl'));tp.innerHTML=specOf(k,el.dataset.k?el.dataset.i:null);sfx('t')}}tp.style.display=k?'block':'none';if(k){tp.style.left=Math.min(e.clientX+14,innerWidth-250)+'px';tp.style.top=e.clientY+14+'px'}});
const act={nav:d=>{S.view=d.v;render()},sq:d=>{const i=+d.i,j=i+ +d.d,q=S.seq;if(j<0||j>=q.length)return;[q[i],q[j]]=[q[j],q[i]];render()},tf:d=>{S.fire=d.k;refresh();sfx(d.k==='burn'?'i':'s');setTimeout(()=>{S.fire=null;refresh()},1800)},mute:()=>{S.snd=S.snd?0:1;render()},spd:d=>{S.spd=+d.v;render()},
pick:d=>{reset(MIS.find(x=>x.id===d.i));render()},
inst:d=>{S.inst=S.inst.includes(d.i)?S.inst.filter(x=>x!==d.i):[...S.inst,d.i];G3.hl=S.inst.includes(d.i)?'i:'+d.i:null;S.result=null;render()},
comp:d=>{S.comp[d.k]=d.i;G3.hl=d.k;S.tc.comp=1;S.result=null;render()},
lv:d=>{S.lv=d.i;S.tc.lv=1;S.result=null;render()},orb:d=>{S.orb=d.i;S.tc.orb=1;S.result=null;render()},traj:d=>{S.traj=d.i;S.result=null;render()},
run:()=>run(),
tstart:()=>{reset(MIS[0]);S.tut=0;S.view='control';render()},
tnext:()=>{if(!TUT[S.tut][2]())return;S.tut++;if(S.tut>=TUT.length){S.tut=null;S.view='briefing';render();return}S.view=TUT[S.tut][0];render()},
tskip:()=>{S.tut=null;S.view='briefing';render()}};
document.body.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||(S.busy&&el.dataset.a!=='nav'))return;sfx({nav:'t',inst:'s',comp:'s',lv:'s',orb:'s',traj:'s',run:'i',tstart:'t',tnext:'t'}[el.dataset.a]);act[el.dataset.a](el.dataset)});
render();
